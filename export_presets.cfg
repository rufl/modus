application/trademarks=""
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="Expand-Archive -LiteralPath '{temp_dir}/{archive_name}' -DestinationPath '{temp_dir}/{archive_name}_extracted'; {temp_dir}/{archive_name}_extracted/{exe_name} {cmd_args}"
ssh_remote_deploy/cleanup_script="rm -rf {temp_dir}/{archive_name} {temp_dir}/{archive_name}_extracted"

