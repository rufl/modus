<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
  <!-- Background -->
  <rect width="124" height="124" x="2" y="2" fill="#1a1d24" stroke="#2a2d34" stroke-width="4" rx="16"/>
  
  <!-- Stylized M shape with gradient -->
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#0066FF"/>
    </linearGradient>
  </defs>
  
  <!-- MODUS "M" letterform - angular, tech-inspired -->
  <path d="M28 96 L28 40 L48 40 L64 72 L80 40 L100 40 L100 96 L82 96 L82 60 L68 88 L60 88 L46 60 L46 96 Z" 
        fill="url(#mGrad)"/>
        
  <!-- Accent lines representing modular/framework nature -->
  <rect x="20" y="28" width="88" height="3" fill="#00D4FF" opacity="0.6" rx="1"/>
  <rect x="20" y="97" width="88" height="3" fill="#0066FF" opacity="0.6" rx="1"/>
</svg>