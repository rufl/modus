name: Code Quality Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  formatting:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install GDScript Toolkit
        run: python -m pip install gdtoolkit==4.5.0

      - name: Check GDScript Formatting
        run: gdformat --check --diff game/ tests/ 2>&1 | tee format-check.log

      - name: Upload Formatting Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatting-report
          path: format-check.log
          retention-days: 7

  linting:
    name: GDScript Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install GDScript Toolkit
        run: python -m pip install gdtoolkit==4.5.0

      - name: Run GDScript Linting
        run: gdlint game/ tests/ 2>&1 | tee lint-report.log

      - name: Upload Linting Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linting-report
          path: lint-report.log
          retention-days: 7

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Analyze GDScript Metrics
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          totals = dict(lines=0, get_node=0, resource_paths=0, prints=0, functions=0, documented=0)
          large_files, complex_files, nested_files = [], [], []
          for root in (Path('game'), Path('tests')):
              if not root.is_dir():
                  raise SystemExit(f'Missing source directory: {root}')
              for path in sorted(root.rglob('*.gd')):
                  if 'addons' in path.parts:
                      continue
                  lines = path.read_text(encoding='utf-8').splitlines()
                  functions = documented = deeply_nested = 0
                  for index, line in enumerate(lines):
                      totals['get_node'] += bool(re.search(r'\bget_node\s*\(', line))
                      totals['resource_paths'] += '"res://' in line
                      totals['prints'] += bool(re.search(r'\bprint\s*\(', line))
                      deeply_nested += line.startswith('\t' * 6)
                      if re.match(r'^\s*(?:static\s+)?func\s+', line):
                          functions += 1
                          previous = lines[index - 1].lstrip() if index else ''
                          documented += previous.startswith('##') or (previous.startswith('#') and '@' in previous)
                  totals['lines'] += len(lines)
                  totals['functions'] += functions
                  totals['documented'] += documented
                  if len(lines) > 500:
                      large_files.append(f'{path}: {len(lines)} lines')
                  if functions > 20:
                      complex_files.append(f'{path}: {functions} functions')
                  if deeply_nested:
                      nested_files.append(f'{path}: {deeply_nested} lines indented at least six tabs')

          report = '\n'.join([
              'Text-based GDScript metrics (not runtime coverage or vulnerability findings):',
              f"Total lines: {totals['lines']}",
              f"Lines containing get_node calls: {totals['get_node']}",
              f"Lines containing resource paths: {totals['resource_paths']}",
              f"Lines containing print calls: {totals['prints']}",
              f"Functions: {totals['functions']}",
              f"Functions preceded by documentation comments: {totals['documented']}",
          ])
          if totals['functions']:
              ratio = totals['documented'] * 100 / totals['functions']
              report += f'\nFunction documentation ratio: {ratio:.1f}%'
              if ratio < 50:
                  print(f'::warning::Function documentation ratio is below 50%: {ratio:.1f}%')
          else:
              report += '\nFunction documentation ratio: not applicable (no functions)'
          print(report)
          Path('static-analysis-metrics.txt').write_text(report + '\n', encoding='utf-8')
          for filename, rows in (
              ('large-files.txt', large_files),
              ('complex-files.txt', complex_files),
              ('nested-files.txt', nested_files),
          ):
              Path(filename).write_text('\n'.join(rows) + ('\n' if rows else ''), encoding='utf-8')
              for row in rows:
                  print(row)
          if totals['get_node'] > 50:
              print('::warning::More than 50 lines contain get_node calls; review null handling')
          if totals['resource_paths'] > 100:
              print('::warning::More than 100 lines contain hardcoded resource paths')
          if totals['prints'] > 50:
              print('::warning::More than 50 lines contain print calls; consider structured logging')
          if len(large_files) > 10:
              print(f'::warning::Found {len(large_files)} files over 500 lines; consider refactoring')
          PY

      - name: Upload Analysis Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-results
          path: |
            static-analysis-metrics.txt
            large-files.txt
            complex-files.txt
            nested-files.txt
          retention-days: 30

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Security Tools
        if: hashFiles('**/*.py') != ''
        run: python -m pip install bandit

      - name: Python Security Analysis
        if: hashFiles('**/*.py') != ''
        run: bandit -r . -f json -o bandit-report.json -ll

      - name: GDScript Security Patterns
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          patterns = {
              'API key/token/secret references': re.compile(r'api[_-]key|token|secret', re.IGNORECASE),
              'Potential hardcoded credential assignments': re.compile(r'\b(?:password|passwd)\s*=', re.IGNORECASE),
              'Dynamic execution references': re.compile(r'\.execute\s*\(|Expression\.new\s*\('),
          }
          counts = dict.fromkeys(patterns, 0)
          for root in (Path('game'), Path('tests')):
              if not root.is_dir():
                  raise SystemExit(f'Missing source directory: {root}')
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path.suffix not in ('.gd', '.json'):
                      continue
                  for line in path.read_text(encoding='utf-8').splitlines():
                      for label, pattern in patterns.items():
                          if label == 'Dynamic execution references':
                              if root.name != 'game' or path.suffix != '.gd':
                                  continue
                          elif '# Example' in line or '# TODO' in line:
                              continue
                          counts[label] += bool(pattern.search(line))
          report = ['Text-pattern review only; matches are not confirmed vulnerabilities.']
          for label, count in counts.items():
              report.append(f'{label}: {count}')
              if count:
                  print(f'::warning::{label}: {count}; review for security')
          # Do not print source lines that might contain credentials.
          Path('security-patterns.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY

      - name: Run Trivy Filesystem Scanner
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: 'true'
          exit-code: '1'

      - name: Upload Trivy Results to GitHub Security
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: code-quality-filesystem

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            security-patterns.txt
            trivy-results.sarif
          retention-days: 30

  dependency-check:
    name: Dependency Configuration Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Godot Addons
        run: |
          : > addon-list.txt
          if [ -d addons ]; then
            find addons/ -name plugin.cfg -exec dirname {} \; | tee addon-list.txt
            echo "Addon binaries for manual review:"
            find addons/ -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.so' \) -print
            echo "Addon configurations:"
            find addons/ -name plugin.cfg -exec echo '=== {} ===' \; -exec cat {} \;
          else
            echo "No addons directory found"
          fi

      - name: Project Configuration Review
        run: |
          test -f project.godot
          if grep -q 'debug.*true' project.godot; then
            echo "::warning::Debug settings found in project.godot"
          fi
          if grep -q 'development.*true' project.godot; then
            echo "::warning::Development settings found in project.godot"
          fi
          echo "Configuration text-pattern review completed; this is not a dependency vulnerability audit."

      - name: Upload Dependency Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: addon-list.txt
          retention-days: 7

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [formatting, linting, static-analysis, security-scan, dependency-check]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Generate Quality Summary
        uses: actions/github-script@v8
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(process.env.JOB_RESULTS);
            const passed = Object.values(results).every(job => job.result === 'success');
            const summary = [
              '# MODUS Framework Code Quality Summary',
              '',
              `Commit: ${context.sha}`,
              '',
              '## Job Status',
              ...Object.entries(results).map(([name, job]) => `- ${name}: ${job.result}`),
              '',
              `## Overall Status: ${passed ? 'PASSED' : 'FAILED'}`,
              '',
              'Runtime test coverage is not measured: this repository has no coverage generator.',
              'Static metrics and security-pattern counts are text heuristics, not runtime coverage or a security certification.',
              'Trivy scans supported repository dependency manifests; no Python dependency manifest is available for a separate dependency audit.',
              '',
            ].join('\n');
            fs.writeFileSync('quality-summary.md', summary);
            await core.summary.addRaw(summary).write();
            if (!passed) core.setFailed('One or more quality jobs did not succeed.');

      - name: Upload Quality Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-summary
          path: quality-summary.md
          retention-days: 30

      - name: Comment Summary on PR
        if: ${{ !cancelled() && hashFiles('quality-summary.md') != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync('quality-summary.md', 'utf8'),
            });
