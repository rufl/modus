name: CI/CD Pipeline - MODUS Framework

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.7.2"

jobs:
  code-quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install GDScript Toolkit
        run: python -m pip install gdtoolkit==4.5.0
      - name: Install pinned GUT dependency for truth checks
        run: bash tools/scripts/install-gut.sh

      - name: Check GDScript Formatting
        run: gdformat --check --diff game/ shared/ standalone/ tests/

      - name: Run GDScript Linting
        run: gdlint game/ shared/ standalone/ tests/

      - name: Check Project Truth
        run: bash tools/check_project_truth.sh

      - name: Check Export Smoke Helper
        run: test -x tools/run_export_smoke.sh

  test:
    name: Run GUT Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install pinned GUT dependency
        run: bash tools/scripts/install-gut.sh

      - name: Install Godot
        run: |
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/$archive"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          mkdir -p test-results

      - name: Cache import assets
        uses: actions/cache@v4
        with:
          path: .godot/imported/
          key: import-assets-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            import-assets-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import project assets
        run: |
          godot --version
          godot --headless --verbose --path . --import

      - name: Run Unit and Integration Tests
        id: unit-tests
        run: |
          source tests/runners/headless_common.sh
          modus_collect_gut_tests tests/unit tests/integration
          modus_print_headless_selection
          modus_run_godot godot --headless -s addons/gut/gut_cmdln.gd \
            "${MODUS_GUT_TEST_ARGS[@]}" -gdisable_colors 2>&1 | tee test-results/unit-tests.log
          # GUT's bootstrap can exit zero before running tests if imports fail.
          grep -Eq '^[[:space:]]*Tests[[:space:]]+[1-9][0-9]*[[:space:]]*$' test-results/unit-tests.log

      - name: Run Property-Based Tests
        id: property-tests
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        run: |
          source tests/runners/headless_common.sh
          modus_collect_gut_tests tests/property
          modus_print_headless_selection
          modus_run_godot godot --headless -s addons/gut/gut_cmdln.gd \
            "${MODUS_GUT_TEST_ARGS[@]}" -gdisable_colors 2>&1 | tee test-results/property-tests.log
          grep -Eq '^[[:space:]]*Tests[[:space:]]+[1-9][0-9]*[[:space:]]*$' test-results/property-tests.log

      - name: Run Benchmark Tests
        id: benchmark-tests
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          source tests/runners/headless_common.sh
          modus_collect_gut_tests tests/benchmarks
          modus_print_headless_selection
          modus_run_godot godot --headless -s addons/gut/gut_cmdln.gd \
            "${MODUS_GUT_TEST_ARGS[@]}" -gdisable_colors 2>&1 | tee test-results/benchmark-tests.log
          grep -Eq '^[[:space:]]*Tests[[:space:]]+[1-9][0-9]*[[:space:]]*$' test-results/benchmark-tests.log

      - name: Publish Test Summary
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit-tests.outcome }}
          PROPERTY_OUTCOME: ${{ steps.property-tests.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark-tests.outcome }}
        run: |
          mkdir -p test-results
          {
            printf '# MODUS Test Results\n\n'
            printf '| Suite | Status |\n| --- | --- |\n'
            printf '| Unit and integration | %s |\n' "$UNIT_OUTCOME"
            printf '| Property-based | %s |\n' "$PROPERTY_OUTCOME"
            printf '| Benchmarks (informational) | %s |\n' "$BENCHMARK_OUTCOME"
            printf '\nDetailed GUT results are in the test-results artifact.\n'
            printf 'GUI-required tests remain outside the maintained headless suite.\n'
          } | tee test-results/test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test-results/
            logs/
            *.log
          retention-days: 30

  build:
    name: Build Project (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux
            preset: Dedicated Server (Linux)
            executable: MODUS.x86_64
          - platform: windows
            preset: Windows Desktop
            executable: MODUS.exe
          - platform: editor
            preset: Standalone Editor
            executable: MODUS-editor.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install pinned GUT dependency
        run: bash tools/scripts/install-gut.sh

      - name: Install Godot and export templates
        run: |
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          release_url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --output "$RUNNER_TEMP/$archive" "$release_url/$archive"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl --fail --location --output "$RUNNER_TEMP/export_templates.tpz" \
            "$release_url/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/export_templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Cache import assets
        uses: actions/cache@v4
        with:
          path: .godot/imported/
          key: import-assets-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            import-assets-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import project assets
        run: |
          godot --version
          godot --headless --verbose --path . --import

      - name: Build for ${{ matrix.platform }}
        env:
          EXPORT_PLATFORM: ${{ matrix.platform }}
          EXPORT_PRESET: ${{ matrix.preset }}
          EXPORT_EXECUTABLE: ${{ matrix.executable }}
        run: |
          mkdir -p "build/$EXPORT_PLATFORM"
          godot --headless --verbose --path . --export-release "$EXPORT_PRESET" \
            "build/$EXPORT_PLATFORM/$EXPORT_EXECUTABLE"
          test -s "build/$EXPORT_PLATFORM/$EXPORT_EXECUTABLE"
          test -s "build/$EXPORT_PLATFORM/${EXPORT_EXECUTABLE%.*}.pck"
          bash tools/run_export_smoke.sh \
            --platform "$EXPORT_PLATFORM" \
            --executable "build/$EXPORT_PLATFORM/$EXPORT_EXECUTABLE" \
            --log "build/$EXPORT_PLATFORM/export-launch.log"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build-${{ github.run_number }}
          path: build/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    name: Verify Staging Artifacts
    runs-on: ubuntu-latest
    needs: [test, build, security-scan]
    if: github.ref == 'refs/heads/develop' && success()
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-build-${{ github.run_number }}'
          path: artifacts/

      - name: Verify Build Artifacts
        run: |
          test -s "artifacts/linux-build-${{ github.run_number }}/MODUS.x86_64"
          test -s "artifacts/linux-build-${{ github.run_number }}/MODUS.pck"
          test -s "artifacts/windows-build-${{ github.run_number }}/MODUS.exe"
          test -s "artifacts/windows-build-${{ github.run_number }}/MODUS.pck"
          test -s "artifacts/editor-build-${{ github.run_number }}/MODUS-editor.exe"
          test -s "artifacts/editor-build-${{ github.run_number }}/MODUS-editor.pck"
          printf 'Supported release artifacts verified. No staging deployment target is configured.\n' \
            >> "$GITHUB_STEP_SUMMARY"
